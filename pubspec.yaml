name: rz_checkliste_risikoanalyse
description: Offline-first audit-ready checklist and risk analysis app for on-prem enterprise data centers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.3
  sqflite_sqlcipher: ^3.2.0
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  crypto: ^3.0.3
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  archive: ^3.6.1
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.0.2
  collection: ^1.18.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog_v1.json
